<!DOCTYPE html>
<html>
<head>
    <title>Login ADMIN - DATISEVERO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #2c3e50; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 10px; width: 350px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h3>DATI<span style="color:#3498db">SEVERO</span></h3>
        <p class="text-muted">Acesso Administrativo</p>
        <form action="/login" method="POST">
            <input type="text" name="usuario" class="form-control mb-3" placeholder="Usuário" required>
            <input type="password" name="senha" class="form-control mb-3" placeholder="Senha" required>
            <button class="btn btn-primary w-100">Entrar</button>
        </form>
        {% if erro %}<p class="text-danger mt-3">{{ erro }}</p>{% endif %}
    </div>
</body>
</html>
